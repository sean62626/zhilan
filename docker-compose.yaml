version: "3.9"

services:
  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:1.27-alpine
    container_name: zhilan-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - zhilan-net
    restart: unless-stopped

  # ========== 前端 Nuxt 3 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhilan-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    networks:
      - zhilan-net
    restart: unless-stopped

  # ========== 后端 FastAPI ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhilan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      opensearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - zhilan-net
    restart: unless-stopped

  # ========== Celery Worker ==========
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhilan-celery-worker
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - backend
    networks:
      - zhilan-net
    restart: unless-stopped

  # ========== Celery Beat ==========
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhilan-celery-beat
    command: celery -A app.scheduler.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - backend
    networks:
      - zhilan-net
    restart: unless-stopped

  # ========== Redis ==========
  redis:
    image: redis:7.4-alpine
    container_name: zhilan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - zhilan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========== OpenSearch 2.x (ES 兼容) ==========
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: zhilan-opensearch
    ports:
      - "9201:9200"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - os-data:/usr/share/opensearch/data
    networks:
      - zhilan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: zhilan-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: zhilan
      MYSQL_USER: zhilan
      MYSQL_PASSWORD: zhilan_secret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - zhilan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
  os-data:
  mysql-data:

networks:
  zhilan-net:
    driver: bridge
